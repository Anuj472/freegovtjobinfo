name: Daily Job Indexing

on:
  schedule:
    - cron: '0 1 * * *'  # 6:30 AM IST daily
  workflow_dispatch:  # Allow manual trigger

jobs:
  index:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Cache indexing data
        uses: actions/cache@v4
        with:
          path: .indexing-cache.json
          key: indexing-cache-${{ github.run_id }}
          restore-keys: |
            indexing-cache-
      
      - name: Install dependencies
        run: npm install
      
      - name: Run indexing script
        env:
          GOOGLE_INDEXING_CREDENTIALS: ${{ secrets.GOOGLE_INDEXING_CREDENTIALS }}
          VITE_BLOGGER_API_KEY: ${{ secrets.VITE_BLOGGER_API_KEY }}
        run: npm run index:jobs
